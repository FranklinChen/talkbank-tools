[package]
name = "batchalign-types"
version = "0.1.0"
description = "Shared batchalign domain and worker protocol types"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
jiff = { workspace = true }
nutype = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Optional: lets `MachineTime` be a SQLite column (the job store), so a
# stored time is validated where it is read. Only `batchalign` enables it.
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tempfile = "3"
# Admitted paths name files the way the disk compares names: NFC on macOS,
# whose file systems ignore Unicode normalization.
unicode-normalization = "0.1.26"
utoipa = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `pathconf(_PC_CASE_SENSITIVE)`: whether a folder's volume ignores case.
libc = { workspace = true }

[features]
sqlx = ["dep:sqlx"]

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
static_assertions = "1.1.0"

[lints]
workspace = true
