[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "batchalign3"
version = "0.8.1"
description = "Transcription, alignment, and language-sample analysis for TalkBank CHAT transcripts"
readme = "batchalign/README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
# Primary author first, matching the Cargo manifests and the commit history.
# The addresses are deliberate: publishing one is what an `authors` field is
# for, and it is the ecosystem norm (71% of 282 surveyed installed packages
# publish an author email), including academic peers this project depends on.
authors = [
    { name = "Franklin Chen", email = "franklinchen@franklinchen.com" },
    { name = "Brian MacWhinney", email = "macw@cmu.edu" },  # screen-allow: cmu-email public authorship credit for a published academic tool
    { name = "Houjun Liu", email = "houjun@cmu.edu" },  # screen-allow: cmu-email public authorship credit for a published academic tool
]
keywords = ["nlp", "linguistics", "chat", "talkbank", "transcription", "forced-alignment", "morphosyntax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dependencies = [
    # Core ML
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=5.13.0",
    "tokenizers>=0.14.1",
    "numpy>=1.26",
    "stanza[transformers]>=1.14.0,<1.15",
    "pycountry>=22.3",
    "soundfile>=0.12.0",
    "librosa>=0.11",
    # ASR
    "openai-whisper",
    "numba>=0.61.0",
    "llvmlite>=0.44.0",
    # Speaker diarization
    "pyannote.audio>=3.1",
    "onnxruntime>=1.16",
    # Audio analysis
    "opensmile>=2.5.0",
    "praat-parselmouth>=0.4.6",
    # Translation
    "googletrans",
    # Runtime
    "pydantic>=2.4",
    "platformdirs>=4.3.0",
    "filelock>=3.0.0",
    "omegaconf>=2.3",
    "typing-extensions",
    "certifi",
    # Utilities
    "praatio>=6.0.0",
    # Cloud ASR + MT providers
    "tencentcloud-sdk-python-common",
    "tencentcloud-sdk-python-asr",
    "tencentcloud-sdk-python-tmt",
    "cos-python-sdk-v5",
    "aliyun-python-sdk-core>=2.13.3",
    "aliyun-python-sdk-alimt>=3.2.0",
    "alibabacloud-nls-python-sdk>=1.0.0",
    # 1.4.13 and 1.4.14 require NumPy<2, downgrading the shared ML stack to
    # NumPy 1.26 (supports Python <=3.12). Revisit when upstream restores
    # compatibility with this package's Python >=3.13 environment.
    "funasr<1.4.13",
    # Qwen3-ASR: Alibaba's open-weight Cantonese-capable ASR. Local
    # model (~3.4 GB fp16) downloaded from HuggingFace on first use.
    # Recommended default for ``yue`` per Lee et al. (2026).
    # Bounded pin so PyCantonese major-version bumps (which can change
    # transitive Rust dependencies) are deliberate decisions, not
    # accidental upgrades.
    "pycantonese>=5.0.0,<6",
]

[project.optional-dependencies]
# ── Development/build ─────────────────────────────────────────────────
train = [
    "accelerate>=0.27",
    "click>=8.1",
    "rich>=13.6",
    "rich-click>=1.7.0",
]
docs = ["mkdocs-material", "mkdocs-click"]

[project.scripts]
batchalign3 = "batchalign._cli:main"

[project.urls]
Homepage = "https://github.com/FranklinChen/talkbank-tools/tree/main/batchalign"
Repository = "https://github.com/FranklinChen/talkbank-tools"
Documentation = "https://github.com/FranklinChen/talkbank-tools/tree/main/batchalign-book"
Issues = "https://github.com/FranklinChen/talkbank-tools/issues"

[tool.maturin]
manifest-path = "crates/batchalign-pyo3/Cargo.toml"
python-source = "."
python-packages = ["batchalign"]
features = ["pyo3/extension-module", "pyo3/abi3-py313"]
# Use the debug profile for editable installs so `uv run <anything>` rebuilds
# the extension in seconds rather than minutes. Release wheels for distribution
# are built explicitly via `maturin build --release` in the GitHub Release
# workflow (and the local release-wheel Make target), which overrides this
# setting.
profile = "dev"
include = [
    { path = "batchalign/runtime_constants.toml", format = "sdist" },
    { path = "batchalign/runtime_constants.toml", format = "wheel" },
    { path = "batchalign/inference/local_pyannote_model.json", format = "sdist" },
    { path = "batchalign/inference/local_pyannote_model.json", format = "wheel" },
    { path = "batchalign/_bin/batchalign3", format = "wheel" },
    { path = "batchalign/_bin/batchalign3.exe", format = "wheel" },
]

[dependency-groups]
dev = [
    "batchalign3",
    "maturin>=1.7,<2.0",
    "mypy",
    "py-spy>=0.4.2",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=5.0",
    "pytest-xdist",
    "ruff",
    "ty",
    "types-requests>=2.32.4.20260107",
]

[tool.uv]
# torchcodec is EXCLUDED, deliberately. It arrives transitively from
# `pyannote.audio`, and nothing in Batchalign needs it.
#
# What it costs to keep: torchcodec ships shared libraries for a FIXED set of
# FFmpeg majors, each linked `@rpath/libavutil.NN.dylib` against the
# UNVERSIONED Homebrew prefix. When Homebrew moves that prefix past the
# supported set, EVERY audio decode raises, at job time rather than at startup.
# One upstream package upgrade is enough to stop transcription everywhere.
#
# Why removing it is safe, verified rather than assumed:
#   * transformers only touches it behind `is_torchcodec_available()`, which is
#     a cached `find_spec` result. Absent, the branch is skipped entirely, and
#     audio still reaches the pipeline through `ffmpeg_read`, a SUBPROCESS that
#     works with any FFmpeg version.
#   * pyannote.audio catches the import failure and sets TORCHCODEC_AVAILABLE
#     to False. Batchalign already hands it `{"waveform", "sample_rate"}`
#     dictionaries, which is the path that never decodes.
#   * torchaudio.load is routed through soundfile at startup
#     (`batchalign.inference.audio.install_soundfile_backend`).
#
# End-to-end mp4 transcription passes with torchcodec absent.
#
# An impossible marker rather than a version pin: the requirement is never
# selected on any platform, which is the only way to drop a transitive
# dependency we do not control.
override-dependencies = ["torchcodec ; sys_platform == 'batchalign-never'"]

[tool.ruff]
# Ruff is a GATE here, not a convenience: `make lint-python` and CI run these
# exact settings, so an editor, a local run and CI cannot disagree. It must be
# invoked through the project environment (`uv run ruff`) so the version comes
# from `uv.lock`. Before this section existed, `uv run ruff` resolved to
# whatever copy happened to be on the machine and applied an inherited rule
# set, which is a measurement nobody can reproduce.
target-version = "py313"
# Generated, vendored, or not-ours. `.venv` and `target` are build output;
# `frontend` is TypeScript with an incidental script or two.
extend-exclude = ["frontend", "book", ".venv", "target"]

[tool.ruff.lint]
# Deliberately a SUBSET, and widening it is a real task rather than a
# permanent default (measured 2026-08-14, over 343 tracked files).
#
# What is in, and why: `F` and `E4/E7/E9` are correctness rather than taste
# (undefined names, unused imports, star-import shadowing). `I` keeps import
# blocks from churning between contributors. `UP` and `B` earn their place on
# this codebase specifically: `B905` is the zip-without-`strict` truncation
# class, which matters where words are zipped against timings.
#
# What is out, and why: `E1/E2/E3/E501` are whitespace and line length, which
# the formatter owns; selecting them makes the two tools argue. The remaining
# families (`N`, `ANN`, `D`, `PL`, ...) are not judged worthless, only
# unassessed, and turning one on is a piece of work with a diff.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
    # CHAT is a Unicode format. CA overlap markers, the 0x15 bullet and IPA
    # are DATA, so "ambiguous character" is the wrong question to ask of this
    # tree: the characters are load-bearing and must stay exactly as written.
    "RUF001",
    "RUF002",
    "RUF003",

    # DEFERRED, each with the count measured on 2026-08-14. These are not
    # judged wrong; they are unfixed, and the gate stays green so that it can
    # fail for a real reason. Removing an entry here is the unit of work.
    #
    # The two at the top are deferred for a REASON, not just for volume, and
    # neither should be bulk-applied:
    #   UP042 (17): `class X(str, Enum)` -> `StrEnum` changes what `str(x)`
    #     returns, and these enums carry wire names that cross the Rust/Python
    #     boundary. A mechanical fix here would silently change dispatch
    #     strings. Convert one at a time, checking each serialization site.
    #   UP040 (29): `TypeAlias` -> the PEP 695 `type` statement produces a lazy
    #     `TypeAliasType` rather than the object itself, which pydantic and
    #     `isinstance` treat differently. Worth doing, needs verifying per site.
    "UP042",
    "UP040",
    # RUF012 (8): mutable class attributes wanting `ClassVar`.
    "RUF012",
    # RUF059 (7): unpacked-but-unused locals wanting a `_` prefix.
    "RUF059",
    # RUF046 (4): int() around an already-integral value.
    "RUF046",
    # UP047 (1): one generic function still on the TypeVar spelling.
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# A package `__init__` exists to re-export; an import with no local use is the
# point, not an oversight.
"__init__.py" = ["F401"]
