name: Pinned ffmpeg
description: >
  Put exactly the ffmpeg release named in scripts/ffmpeg-pin.sh on PATH, and
  prove it. The media tests measure ffmpeg's own behaviour (what ffprobe
  states, what a decode produces), and Ubuntu's package is a different
  release from the developer's: on 2026-09-30 two tests that passed locally
  on 9.0.2 failed on the runner's 6.1.1. The release is built once from its
  hash-checked source tarball and cached by the pin, so a bump rebuilds and
  every other run restores it in seconds.

  One action so that every job needing ffmpeg gets the same release by the
  same route; a job that installed the distribution package instead would
  test against a decoder nobody pinned.

  Expects the caller to have run `apt-get update` already (both callers do,
  for their own packages), so the package lists are not refreshed twice.

runs:
  using: composite
  steps:
    - name: Restore pinned ffmpeg
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.local/ffmpeg-pinned
        key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ffmpeg-pin.sh', 'scripts/install-pinned-ffmpeg.sh') }}

    - name: Install the pinned build's runtime library
      # libmp3lame is the build's one external library. A restored build
      # needs only the runtime package; the headers and assembler are for a
      # rebuild.
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: sudo apt-get install -y libmp3lame0

    - name: Build pinned ffmpeg
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get install -y libmp3lame-dev nasm pkg-config
        bash scripts/install-pinned-ffmpeg.sh "$HOME/.local/ffmpeg-pinned"

    - name: Save pinned ffmpeg
      # Saved here, right after the build, rather than by a post-job step:
      # a post-job save is skipped when any later step fails, which would
      # throw away a finished multi-minute build on every red run.
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.local/ffmpeg-pinned
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Put pinned ffmpeg on PATH and check it
      shell: bash
      run: |
        echo "$HOME/.local/ffmpeg-pinned/bin" >> "$GITHUB_PATH"
        PATH="$HOME/.local/ffmpeg-pinned/bin:$PATH" bash scripts/check-ffmpeg-pin.sh
