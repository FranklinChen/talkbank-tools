name: Batchalign Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  batchalign-rust:
    name: Imported Batchalign Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust test prerequisites
        # ripgrep is required by the Phase α architectural-invariant
        # test (memory_tier_is_sole_source_for_per_profile_envelopes)
        # which shells out to rg to scan production sources for
        # parallel *_startup_mb definitions. Install explicitly so the
        # test does not depend on the runner image version.
        # The real decoder-error regression requires ffmpeg as well.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ripgrep ffmpeg

      - name: Cache cargo artifacts
        # Job-scoped, and that is deliberate. Sharing a key with the Python
        # workflow's build-cli job looks attractive because both compile this
        # workspace, and it is wrong: build-cli runs `cargo build -p
        # batchalign`, which resolves no dev-dependencies and builds no test
        # targets, while this job runs the whole gate including four test
        # invocations. rust-cache saves on post-job and skips the second save
        # of an identical key, so the shorter job would decide the contents and
        # this one would recompile every dev-dependency on every run.
        uses: Swatinem/rust-cache@v2

      - name: Build dashboard assets
        run: make batchalign-dashboard-build

      - name: Run imported Batchalign Rust CI gate
        run: make batchalign-ci-rust

  batchalign-pyo3:
    name: Imported Batchalign PyO3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo artifacts
        # Job-scoped, like every other compiling job here. This one builds a
        # single crate, so a cache it saved would be thinner still than the
        # gate job's.
        uses: Swatinem/rust-cache@v2

      - name: Build imported standalone PyO3 crate
        run: make batchalign-build-pyo3
