name: CI

# Cross-cutting repo hygiene for the batchalign3 workspace. The CHAT-format
# gates (parser/spec/grammar/corpus/generated-artifacts/fuzz/parser-equivalence)
# moved to the chatter repo, which is now the single home for the CHAT core. The
# batchalign Rust / PyO3 compile + test gate lives in batchalign-rust.yml; the
# Python and desktop gates in batchalign-python.yml / batchalign-desktop.yml; the
# mdBook build in book.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every gate here is a property of the COMMIT, and a developer can make each one
# pass before pushing (`make gate` runs them). Dependency advisories
# are deliberately NOT here: they are a property of the world on the day the job
# runs, so the same commit goes red without changing, and the person blocked
# cannot fix it by fixing their work. They live in dependency-audit.yml, on a
# schedule, reporting rather than blocking. Anything added to this file must
# satisfy the same test.
jobs:
  shellcheck:
    name: Shell scripts (shellcheck, strictest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin shellcheck to the current latest release instead of the
      # distro-shipped one. ubuntu-latest's apt shellcheck lags, and its
      # older SC2317 ("unreachable command") logic false-positives on
      # indirectly invoked functions (e.g. scripts/temporal-stress-test.sh)
      # that current shellcheck no longer flags. Per the CI policy, use the
      # latest tool. Latest: https://github.com/koalaman/shellcheck/releases
      - name: Install shellcheck (pinned latest)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o shellcheck.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Every tracked shell script must pass shellcheck at its default
      # (strictest) severity. The runner finds every *.sh plus shebang
      # scripts via git ls-files. See CLAUDE.md.
      - name: shellcheck all shell scripts
        run: make lint-shell
      - name: Verify exact-tree gate receipts
        run: make gate-receipts-test

  # rustfmt was enforced ONLY by the unversioned local pre-push hook, so a
  # fresh clone (or any push that skipped hooks) could land unformatted code
  # and CI would stay green. On 2026-07-31 six files had drifted across two
  # days of commits. This is the cheapest possible gate and belongs here.
  formatting:
    name: Rust formatting (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: make fmt-check

  # An unparseable workflow file does not announce itself: GitHub reports the
  # run under the file's PATH instead of its `name`, which reads like an
  # ordinary red job, and the whole workflow silently never runs. That is what
  # happened to Batchalign Python, whose `- name: Smoke test: ...` (an
  # unquoted colon) took the entire Python CI offline. actionlint finds it in
  # one second, and also shellchecks every embedded `run:` script.
  workflow-lint:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  ci-report:
    name: CI Gate Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - shellcheck
      - formatting
      - workflow-lint

    steps:
      - name: Write gate summary
        run: |
          result_to_badge() {
            case "$1" in
              success)   echo "passed" ;;
              failure)   echo "failed" ;;
              cancelled) echo "cancelled" ;;
              skipped)   echo "skipped" ;;
              *)         echo "$1" ;;
            esac
          }

          {
            echo "## CI Gate Results"
            echo ""
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| Shell scripts (shellcheck, strictest) | $(result_to_badge '${{ needs.shellcheck.result }}') |"
            echo "| Rust formatting (rustfmt) | $(result_to_badge '${{ needs.formatting.result }}') |"
            echo "| Workflow files (actionlint) | $(result_to_badge '${{ needs.workflow-lint.result }}') |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Single merge-gate: fail if any dependency failed or was cancelled.
          if [[ "${{ needs.shellcheck.result }}"        != "success" ||
                "${{ needs.formatting.result }}"        != "success" ||
                "${{ needs.workflow-lint.result }}"     != "success" ]]; then
              echo "### One or more gates failed, see job logs above" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

          echo "### All gates passed" >> "$GITHUB_STEP_SUMMARY"
