name: TalkBank Toolchain mdBook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/book.yml'
      - 'book/**'
      - 'scripts/mdbook_git_dates.py'
      - 'scripts/test_mdbook_git_dates.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/book.yml'
      - 'book/**'
      - 'scripts/mdbook_git_dates.py'
      - 'scripts/test_mdbook_git_dates.py'
  workflow_dispatch:

# Least privilege at the top; the deploy job widens its own scope below.
permissions:
  contents: read

# One Pages deployment at a time; never cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build TalkBank Toolchain mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The git-dates preprocessor stamps every page with the date of its
          # last commit and refuses a shallow clone, where every file would
          # carry the checkout's date.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Preserve the pinned installed tools; compiling all three from scratch
      # took 4m28s in the 2026-09-06 branch rehearsal.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: book-tools
      # Book toolchain, pinned to exact versions that match the Makefile's
      # install hint and chatter's book (one inventory in the private
      # workspace keeps every site in step). The mermaid preprocessor is
      # protocol-sensitive to mdBook's wire format, so the pair moves
      # together. Link-checking is decoupled onto lychee, which runs on the
      # built HTML and is independent of mdBook's wire format.
      - name: Install mdbook + mdbook-mermaid + lychee
        run: |
          cargo install \
            mdbook@0.5.4 \
            mdbook-mermaid@0.17.1 \
            lychee@0.24.2 \
            --locked
      - name: Test the git-dates preprocessor
        run: python3 -m unittest scripts/test_mdbook_git_dates.py
      - name: Build book
        # Run with the book directory as cwd, never `mdbook build book` from
        # the repo root: mdBook 0.4.x sets no cwd of its own
        # for preprocessor subprocesses and just inherits whatever directory
        # `mdbook` itself was started from, so book.toml's `../scripts/...`
        # preprocessor commands only resolve when that directory is `book/`.
        working-directory: book
        run: mdbook build
      - name: Verify the front page carries git-derived dates
        run: python3 scripts/mdbook_git_dates.py verify --book-root book --page introduction.md book/build/index.html
      - name: Link-check book (lychee, offline)
        run: lychee --offline --root-dir "${GITHUB_WORKSPACE}/book/build" "${GITHUB_WORKSPACE}/book/build"
      - name: Test book code blocks (fence-shape regression guard)
        # Every Rust block in the book is currently rust,ignore (mdbook
        # test can't disambiguate workspace crate variants in
        # target/debug/deps/, so executable doctest verification lives
        # in crates/<crate>/tests/book_*_examples.rs files instead).
        # This step is a guard against untagged ``` fences or stray
        # ``` rust blocks creeping back in. Same cwd requirement as the
        # build step above; 0.5.x always uses the book directory, 0.4.x did not.
        working-directory: book
        run: mdbook test
      - name: Upload book artifact
        uses: actions/upload-artifact@v7
        with:
          name: talkbank-toolchain-book
          path: book/build/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/build

  deploy:
    name: Deploy book to GitHub Pages
    needs: build
    # Branch dispatches validate without attempting a protected deployment.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
