name: TalkBank Toolchain mdBook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/book.yml'
      - 'book/**'
      - 'scripts/mdbook_git_dates.py'
      - 'scripts/test_mdbook_git_dates.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/book.yml'
      - 'book/**'
      - 'scripts/mdbook_git_dates.py'
      - 'scripts/test_mdbook_git_dates.py'
  workflow_dispatch:

# Least privilege at the top; the deploy job widens its own scope below.
permissions:
  contents: read

# One Pages deployment at a time; never cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build TalkBank Toolchain mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The git-dates preprocessor stamps every page with the date of its
          # last commit and refuses a shallow clone, where every file would
          # carry the checkout's date.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Preserve the pinned installed tools; compiling all three from scratch
      # took 4m28s in the 2026-09-06 branch rehearsal.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: book-tools
      # Book toolchain, pinned to exact versions that match the Makefile's
      # install hint and chatter's book (one inventory in the private
      # workspace keeps every site in step). The mermaid preprocessor is
      # protocol-sensitive to mdBook's wire format, so the pair moves
      # together. Link-checking is decoupled onto lychee, which runs on the
      # built HTML and is independent of mdBook's wire format.
      - name: Install mdbook + mdbook-mermaid + lychee
        run: |
          cargo install \
            mdbook@0.5.4 \
            mdbook-mermaid@0.17.1 \
            lychee@0.24.2 \
            --locked
      - name: Build and check the book
        # The make target the local gate runs, so the two cannot disagree:
        # preprocessor tests, the build (from `book/`, which book.toml's
        # `../scripts/...` preprocessor commands require), the git-dates
        # verification, the offline lychee link check and the fence-shape
        # `mdbook test` guard. These were five steps written out here and
        # copied by hand into the Makefile, and the copy drifted on
        # 2026-07-31; the target's comments explain each step.
        run: make book-check
      - name: Upload book artifact
        uses: actions/upload-artifact@v7
        with:
          name: talkbank-toolchain-book
          path: book/build/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/build

  deploy:
    name: Deploy book to GitHub Pages
    needs: build
    # Branch dispatches validate without attempting a protected deployment.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
