name: Batchalign Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cli:
    name: Build CLI Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - name: Build dashboard
        run: make batchalign-dashboard-build
      # Push CI needs a fresh binary from this commit for packaging and smoke
      # tests. The release rehearsal and tag workflow own optimized artifacts;
      # compiling release mode here added about nine minutes to every push.
      - name: Build development CLI binary
        run: cargo build -p batchalign
      - uses: actions/upload-artifact@v7
        with:
          name: cli-binary
          path: target/debug/batchalign3
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: frontend/dist/
          retention-days: 1
          if-no-files-found: error

  build-wheel:
    name: Build Development ABI3 Wheel
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pyo3 -> target"
          shared-key: build-wheel-development
      - uses: actions/download-artifact@v8
        with:
          name: cli-binary
          path: batchalign/_bin/
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: frontend/dist/
      - name: Make CLI binary executable
        run: chmod +x batchalign/_bin/batchalign3
      - name: Build development-profile ABI3 wheel
        # One cp313-abi3 wheel is valid on every supported Python. The test
        # matrix below installs this exact artifact under 3.13 and 3.14.
        env:
          BATCHALIGN_PRESTAGED_BIN: "1"
        run: make batchalign-build-ci-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 1

  test:
    name: Test (${{ matrix.python-version }})
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      # Test every officially supported Python (3.13/3.14) on every push
      # and dispatch; see build-wheel for the rationale. fail-fast off so one
      # version's failure still reports the others.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Run tests
        run: uv run --no-sync pytest batchalign --disable-pytest-warnings -k 'not test_whisper_fa_pipeline'

  smoke-test:
    name: Wheel Smoke Test
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - name: Install wheel in clean environment
        run: uv tool install --from dist/*.whl batchalign3
      - name: "Smoke test: batchalign3 --help"
        run: batchalign3 --help
      - name: "Smoke test: batchalign3 version"
        run: batchalign3 version

  typecheck:
    name: Type Check & Python Hygiene
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: frontend/dist/
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Verify retirement gates
        run: |
          test ! -e batchalign/cli/cli.py
          test ! -e batchalign/serve/app.py
          test ! -e batchalign/serve/job_store.py
      - name: Verify runtime constants
        run: uv run --no-sync python scripts/check_runtime_drift.py
      - name: Verify IPC schema matches the Rust types
        # The schema is generated from the Rust types and committed. Nothing
        # ran this before, so a schema stale against its own source could sit
        # in the tree indefinitely; the conformance test reads the SCHEMA, so a
        # stale one silently checks Python against yesterday's contract.
        #
        # Through `uv run`, so the check uses the binary bundled in the
        # wheel this job already installed. A bare `cargo run` would compile
        # the crate again in the debug profile, which is the cost the CI
        # hygiene step above was rewritten to avoid.
        run: uv run --no-sync batchalign3 ipc-schema --check --output ipc-schema/
      - name: Ruff lint and format check
        # The make target, not the two commands, so this job and the pre-push
        # hook cannot disagree about what ruff runs. Config lives in
        # pyproject.toml and ruff comes from the dev group in uv.lock, so CI and
        # a developer resolve the same version and the same rules.
        #
        # These two steps used to be written out here, which is how a formatting
        # failure reached main on 2026-08-14: the hook's coverage check reads
        # `make` targets, so a workflow step that invokes a tool directly is
        # invisible to it.
        run: make batchalign-lint-python-source
      - name: Strict mypy
        run: uv run --no-sync mypy

  generated-artifacts:
    name: Generated Artifacts
    needs: build-cli
    runs-on: ubuntu-latest
    # Generate the schema with this commit's binary from build-cli. Compiling a
    # second server binary here made this source-drift check take five minutes.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cli-binary
          path: target/debug/
      - name: Make CLI binary executable
        run: chmod +x target/debug/batchalign3
      - name: Verify dashboard API artifacts
        env:
          BATCHALIGN_BIN: ${{ github.workspace }}/target/debug/batchalign3
        run: make batchalign-dashboard-api-check

  # Note: the previous standalone `dashboard-web-build` job was retired
  # its API-drift step duplicated `generated-artifacts` above, and its
  # dashboard build duplicated the one in `build-cli` (which now uploads
  # the result as the `dashboard-dist` artifact for downstream jobs).

  rust-integration:
    name: Rust Integration
    # Depends on both build-cli (for the prebuilt batchalign3 binary
    # used in the smoke test) and build-wheel (for the Python wheel
    # used by the test-echo runtime). Reusing build-cli's binary saves
    # ~5 min of duplicate debug-mode compilation.
    needs: [build-cli, build-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: frontend/dist/
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: cli-binary
          path: target/debug/
      - name: Make CLI binary executable
        run: chmod +x target/debug/batchalign3
      - name: Install batchalign
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Server startup smoke test
        # Uses build-cli's development binary instead of rebuilding in-job.
        # The release workflow separately proves the optimized binary.
        #
        # `--warmup off` was dropped when startup warmup was retired: the
        # flag no longer exists and the server refuses to start with it.
        env:
          BATCHALIGN_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          ./target/debug/batchalign3 serve start \
            --foreground --test-echo --port 18123 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18123/health | grep -q '"status":"ok"'; then
              echo "Server healthy after ${i}s"
              kill $SERVER_PID
              wait $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  coverage:
    name: Coverage
    needs: build-wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /usr/share/swift
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Python coverage
        run: uv run --no-sync pytest --cov=batchalign --cov-report=lcov:lcov-python.info batchalign --disable-pytest-warnings -k 'not test_whisper_fa_pipeline'
      # The workspace pass already includes batchalign-pyo3. Running it
      # separately repeats its instrumented tests. The experimental desktop
      # shell is outside CI's supported package set and requires GTK/WebKit;
      # do not accidentally pull it into this headless coverage job.
      - name: Rust workspace coverage
        run: cargo llvm-cov --workspace --exclude batchalign-dashboard-desktop --locked --lcov --output-path lcov-rust-workspace.info

  dashboard-smoke:
    name: Dashboard Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dashboard-release
      - name: Run smoke suite
        env:
          BATCHALIGN_PLAYWRIGHT_WITH_DEPS: "1"
          RUSTFLAGS: -C debuginfo=0
        run: bash scripts/run_react_dashboard_smoke.sh

  dashboard-e2e:
    name: Dashboard E2E
    # Depends on both build-cli (for the pre-built batchalign3 binary)
    # and build-wheel (for the Python wheel). Both are development-profile
    # artifacts compiled from this commit; optimized artifacts are the release
    # workflow's responsibility.
    needs: [build-cli, build-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /usr/share/swift
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dashboard-release
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: cli-binary
          path: target/debug/
      - name: Make CLI binary executable
        run: chmod +x target/debug/batchalign3
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json
      - name: Run E2E suite
        env:
          BATCHALIGN_PLAYWRIGHT_WITH_DEPS: "1"
          BATCHALIGN_REAL_SERVER_E2E: "1"
          # scripts/run_react_dashboard_smoke.sh checks BATCHALIGN_BIN
          # and skips its own cargo build if the binary is already
          # in place. Pointing at the artifact downloaded above is what
          # makes this job sub-15-minute.
          BATCHALIGN_BIN: ${{ github.workspace }}/target/debug/batchalign3
          RUSTFLAGS: -C debuginfo=0
        run: |
          BATCHALIGN_PYTHON="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          export BATCHALIGN_PYTHON
          bash scripts/run_react_dashboard_smoke.sh
