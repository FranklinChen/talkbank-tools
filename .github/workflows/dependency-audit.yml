name: Dependency Audit

# Dependency advisories, on a SCHEDULE rather than on every push.
#
# Why this is not a push gate: an advisory is not a property of the commit being
# pushed. The identical commit is green one day and red the next because someone
# published a CVE overnight, so the gate fails for a reason the person it blocks
# cannot fix by fixing their work. On 2026-08-14 a deploy-day push was stopped by
# a newly-published `lightning` advisory that had no released fix at all.
#
# Audit the committed lockfiles. Re-resolving first can hide an advisory in
# the versions actually shipped. The one retained Python exception below is
# scoped to the packaged Pyannote model graph; new advisories still report.

on:
  schedule:
    # Mondays 09:00 UTC. A weekly cadence matches how fast anything actionable
    # here moves; the previous per-push cadence produced no faster response,
    # only more interruptions.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Python audit
        # Reviewed 2026-09-06: PYSEC-2026-3624 / CVE-2026-58659 affects
        # Lightning 2.6.5 checkpoint instantiators. Pyannote reaches the loader,
        # so this is not an unreachable-function claim. pyannote_local.py admits
        # the packaged full-revision model graph; jobs cannot supply arbitrary
        # checkpoint paths. Local model caches remain trusted artifacts.
        # Both Lightning packages still publish 2.6.5 as latest. Adopt a released
        # compatible fix for upstream commit d710d68 when available; do not treat
        # the advisory's 2022.6.15 version as an upgrade instruction.
        # NLTK is removed; the old Transformers 4.x exemptions are obsolete.
        # Audit exact locked versions without pip re-resolution. The intentionally
        # excluded TorchCodec marker has no artifact hash in uv's export, so a
        # require-hashes audit rejects that non-installable entry before filtering.
        run: |
          uv export --locked --no-hashes --no-dev --no-emit-project > requirements-audit.txt
          uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt \
            --ignore-vuln PYSEC-2026-3624

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Audits read dependencies but compile no workspace targets.
          shared-key: dependency-audit
          cache-targets: false
      - name: Validate committed lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: RustSec audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny
        run: cargo deny check
