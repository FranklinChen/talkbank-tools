[mypy]
python_version = 3.12
files = batchalign
exclude = batchalign/tests
ignore_missing_imports = true
mypy_path = stubs
strict = true
show_error_codes = true

# ---------------------------------------------------------------------------
# ML stub exemptions, ENUMERATED rather than blanket.
#
# Inference and model-training code interacts with PyTorch, HuggingFace
# Transformers, NeMo and friends, whose type stubs are incomplete or wrong.
# Chasing upstream stubs is not useful work, so those modules are exempt.
#
# The exemption is per module ON PURPOSE. It used to be a blanket
# `[mypy-batchalign.inference.*]` plus a hand-added exception per proven-clean
# module, which meant a new module with NO ML surface at all inherited the
# exemption by default. That is how, on 2026-07-31, a function carrying two
# hard errors (an undefined name, and a bool returned from a `-> None`
# signature) landed and nothing noticed: the blanket ignore was the only reason
# it could, and `_italian_mwt` had to be re-enabled by hand afterwards. That
# module needs no section now; it is checked because it is simply not listed.
#
# Measured 2026-09-16 with every carve-out switched off: 15 of the 36 modules
# under `inference` and 4 of the 10 under `models` report anything at all. The
# other 27 are gated from here on by not appearing below, and so is any module
# added later, which is the property the blanket ignore could not give.
# `batchalign.worker._main` was exempt on the same basis; its 5 errors were
# annotation-level rather than stub-level, so they are fixed and it is gone.
#
# Each entry carries the count measured on that date, so a module that shrinks
# is visible. Removing an entry is the unit of work: fix the module, confirm it
# reports zero, delete its section. Never silence one with an inline ignore.
# ---------------------------------------------------------------------------

# 26: union-attr on torchaudio/soundfile backend handles, plus arg-type/index.
[mypy-batchalign.inference.audio]
ignore_errors = true

# 23: operator/index over pyannote and NeMo annotation objects.
[mypy-batchalign.inference.speaker]
ignore_errors = true

# 14: attr-defined on torchaudio forced-align kernel handles.
[mypy-batchalign.inference.fa]
ignore_errors = true

# 10: six of these are unused-ignore, so this one is close to clean.
[mypy-batchalign.inference.languages.cantonese._qwen_common]
ignore_errors = true

# 6: attr-defined/arg-type across whisper and transformers handles.
[mypy-batchalign.inference.asr]
ignore_errors = true

# 5: arg-type against Stanza pipeline signatures.
[mypy-batchalign.inference.morphosyntax]
ignore_errors = true

# 4: arg-type against Stanza pipeline signatures.
[mypy-batchalign.inference.utseg]
ignore_errors = true

# 4: three are unused-ignore.
[mypy-batchalign.inference.qwen_forced_alignment]
ignore_errors = true

# 3: torch-facing aliases in the FA/ASR handle definitions.
[mypy-batchalign.inference.types]
ignore_errors = true

# 2: attr-defined on the opensmile feature-set enums.
[mypy-batchalign.inference.opensmile]
ignore_errors = true

# 2: no-any-return out of the Tencent cloud SDK.
[mypy-batchalign.inference.languages.cantonese._tencent_api]
ignore_errors = true

# 2: one missing annotation and one arg-type at the aligner boundary.
[mypy-batchalign.inference.languages.cantonese._cantonese_fa]
ignore_errors = true

# 1: return-value at the pyannote local-model boundary.
[mypy-batchalign.inference.pyannote_local]
ignore_errors = true

# 1: call-overload against the pyannote.ai client.
[mypy-batchalign.inference.pyannote_ai]
ignore_errors = true

# 1: one var-annotated. Nearly clean.
[mypy-batchalign.inference.languages.cantonese._asr_types]
ignore_errors = true

# 14, and ALL FOURTEEN are unused-ignore: stale `type: ignore` comments rather
# than live stub problems. Deleting them should make this module gateable, and
# that is the cheapest remaining win in this list.
[mypy-batchalign.models.training.run]
ignore_errors = true

# 7: arg-type against the HuggingFace Trainer surface.
[mypy-batchalign.models.utterance.train]
ignore_errors = true

# 6: assignment/type-arg over torch Dataset generics.
[mypy-batchalign.models.utterance.dataset]
ignore_errors = true

# 1: one arg-type at the tokenizer call.
[mypy-batchalign.models.utterance.infer]
ignore_errors = true
